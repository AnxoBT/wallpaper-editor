name: Bug report / Problema
description: Something doesn't work as expected / Algo no funciona como debería
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't include personal photos or data.
        Gracias por avisar. No incluyas fotos ni datos personales.
  - type: dropdown
    id: platform
    attributes:
      label: Platform / Plataforma
      options: [Android, Windows, iPhone]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and system / Dispositivo y sistema
      placeholder: "Samsung Galaxy A54, Android 14, One UI 6.1"
    validations:
      required: true
  - type: input
    id: launcher
    attributes:
      label: Launcher (Android) / Escritorio
      placeholder: "Stock launcher / el del móvil, Nova, Niagara…"
  - type: textarea
    id: steps
    attributes:
      label: What you did / Qué hiciste
      placeholder: "1. …\n2. …"
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened and what you expected / Qué pasó y qué esperabas
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Capturas
